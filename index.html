
<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>宇宙てちょう</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(-45deg,#ffd8ef,#d7d6ff,#d8f5ff,#efe3ff);background-size:400% 400%;animation:bg 18s ease infinite;display:flex;align-items:center;justify-content:center;height:100vh}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#stars,.glow{position:fixed;inset:0;pointer-events:none}.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s infinite}
@keyframes tw{50%{opacity:1;transform:scale(1.6)}0%,100%{opacity:.25}}
.card{position:relative;z-index:2;width:min(92vw,460px);padding:40px;border-radius:30px;background:rgba(255,255,255,.42);backdrop-filter:blur(20px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:f 5s ease-in-out infinite}
@keyframes f{50%{transform:translateY(-10px)}}
img{width:150px;animation:p 4s ease-in-out infinite}@keyframes p{50%{transform:translateY(-8px)}}
h1{color:#fff;text-shadow:0 0 20px #fff;font-size:42px}p{color:#fff;line-height:1.8}
a{display:block;margin:16px 0;padding:16px;border-radius:18px;text-decoration:none;color:#fff;font-weight:bold;background:linear-gradient(135deg,#8ec5ff,#b388ff,#ffb6d9);transition:.3s}
a:hover{transform:translateY(-4px) scale(1.02)}
footer{color:#fff8;margin-top:20px;font-size:13px}
.shoot{position:fixed;width:2px;height:120px;background:linear-gradient(#fff,transparent);transform:rotate(45deg);animation:shoot 8s linear infinite}
@keyframes shoot{0%{opacity:0;transform:translate(-200px,-200px) rotate(45deg)}8%{opacity:1}20%{opacity:0;transform:translate(1200px,900px) rotate(45deg)}100%{opacity:0}}
</style></head><body>
<div id="stars"></div><div class="shoot" style="top:10%;left:15%"></div><div class="shoot" style="top:40%;left:75%;animation-delay:4s"></div>
<div class="card">
<img src="purumaru.png" alt="ぷるまる">
<h1>宇宙てちょう</h1>
<p>今日の想いを、<br>そっと宇宙へ届けよう。</p>
<a href="privacy.html">🛡️ プライバシーポリシー</a>
<a href="terms.html">📖 利用規約</a>
<p>ありがとうの積み重ねが、<br>未来をやさしく照らします ✨</p>
<footer>© 2026 Mogu Atelier</footer>
</div>
<script>
const s=document.getElementById('stars');
for(let i=0;i<150;i++){let d=document.createElement('div');d.className='star';let z=Math.random()*3+1;d.style.width=z+'px';d.style.height=z+'px';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDuration=(2+Math.random()*4)+'s';d.style.animationDelay=(Math.random()*4)+'s';s.appendChild(d);}
document.querySelector('img').onclick=e=>{
 for(let i=0;i<20;i++){let st=document.createElement('div');st.textContent='✨';st.style.position='fixed';st.style.left=e.clientX+'px';st.style.top=e.clientY+'px';st.style.transition='1s';document.body.appendChild(st);requestAnimationFrame(()=>{st.style.transform=`translate(${(Math.random()-0.5)*160}px,${(Math.random()-0.5)*160}px)`;st.style.opacity=0});setTimeout(()=>st.remove(),1000);}
}
</script></body></html>
