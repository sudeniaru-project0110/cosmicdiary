<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>宇宙てちょう</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(160deg,#c8d8ff,#d8c8ff,#ffe4f3);

    overflow:hidden;
}

/* 星 */

.star{

    position:absolute;

    width:4px;
    height:4px;

    background:white;

    border-radius:50%;

    animation:twinkle 3s infinite ease-in-out;

}

@keyframes twinkle{

0%,100%{

opacity:.3;
transform:scale(.8);

}

50%{

opacity:1;
transform:scale(1.5);

}

}

.card{

    width:min(92%,430px);

    background:rgba(255,255,255,.65);

    backdrop-filter:blur(20px);

    border-radius:30px;

    padding:45px 30px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.12);

}

.icon{

    font-size:62px;

    margin-bottom:12px;

}

h1{

    color:#4b52d3;

    margin-bottom:12px;

}

.subtitle{

    color:#666;

    line-height:1.8;

    margin-bottom:35px;

}

.button{

    display:block;

    text-decoration:none;

    background:white;

    color:#4b52d3;

    padding:16px;

    margin:15px 0;

    border-radius:18px;

    font-weight:bold;

    transition:.25s;

}

.button:hover{

    transform:translateY(-4px);

    box-shadow:0 10px 25px rgba(80,80,160,.18);

}

.footer{

    margin-top:30px;

    color:#777;

    font-size:13px;

}

</style>

</head>

<body>

<div class="star" style="top:10%;left:15%;animation-delay:0s"></div>
<div class="star" style="top:18%;left:80%;animation-delay:1s"></div>
<div class="star" style="top:28%;left:30%;animation-delay:2s"></div>
<div class="star" style="top:40%;left:90%;animation-delay:1.5s"></div>
<div class="star" style="top:60%;left:8%;animation-delay:.5s"></div>
<div class="star" style="top:75%;left:70%;animation-delay:2.2s"></div>
<div class="star" style="top:88%;left:25%;animation-delay:1.3s"></div>
<div class="star" style="top:82%;left:92%;animation-delay:.8s"></div>

<div class="card">

<div class="icon">🌌</div>

<h1>宇宙てちょう</h1>

<p class="subtitle">
今日の想いを、<br>
そっと宇宙へ届けよう。
</p>

<a class="button" href="privacy.html">
🛡️ プライバシーポリシー
</a>

<a class="button" href="terms.html">
📖 利用規約
</a>

<div class="footer">
© 2026 宇宙てちょう
</div>

</div>

</body>
</html>
